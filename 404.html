<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — Dentiva</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--ink:#0F2238;--soft:#4B5B70;--gold:#94702F}
@media (prefers-color-scheme:dark){:root{--bg:#09131F;--ink:#E8EDF3;--soft:#9AA8B8;--gold:#D9B76E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,sans-serif;padding:24px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(40px,8vw,72px);margin:24px 0 12px;line-height:1.05}
h1 span{color:var(--gold)}
p{color:var(--soft);font-size:18px;margin:0 0 32px}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;background:#183858;color:#fff;text-decoration:none;font-weight:600}
a:hover{background:#3F5E96}
</style>
</head>
<body>
<main>
  <img src="/dentiva-logo-bulat.svg" alt="Dentiva">
  <h1>Halaman ini <span>tidak ditemukan.</span></h1>
  <p>Tautan mungkin salah ketik atau halaman sudah dipindahkan.</p>
  <a href="/">Kembali ke beranda</a>
</main>
</body>
</html>
